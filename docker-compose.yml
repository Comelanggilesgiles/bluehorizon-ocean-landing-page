services:
  bluehorizon-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bluehorizon/landing:latest
    container_name: bluehorizon-web
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - bluehorizon-net

networks:
  bluehorizon-net:
    driver: bridge
